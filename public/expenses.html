<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Htracker — Expenses</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">🏠 Htracker</div>
  <nav class="app-nav">
    <a href="/index.html">Dashboard</a>
    <a href="/calendar.html">Calendar</a>
    <a href="/expenses.html">Expenses</a>
    <div class="user-pill">
      <span id="userPill"></span>
      <button id="logoutBtn" class="btn-secondary">Log out</button>
    </div>
  </nav>
</header>

<main class="app-main">
  <div class="toolbar">
    <h2 style="margin:0">Expenses</h2>
    <button class="btn-primary" id="addExpenseBtn" style="width:auto">+ Add Expense</button>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Payment type</th>
          <th>Frequency</th>
          <th>Current cost</th>
          <th>Next due</th>
          <th>Next increase</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expenseRows"></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay hidden" id="formModal">
  <div class="modal">
    <h2 id="formModalTitle">Add Expense</h2>
    <form id="expenseForm">
      <input type="hidden" id="expenseId">
      <div class="field">
        <label for="fName">Name</label>
        <input id="fName" required>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="fCategory">Category</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label for="fPaymentType">Payment type</label>
          <select id="fPaymentType"></select>
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="fFrequency">Frequency</label>
          <select id="fFrequency"></select>
        </div>
        <div class="field">
          <label for="fAmount">Cost (£)</label>
          <input id="fAmount" type="number" step="0.01" min="0" required>
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="fStartDate">Start / first due date</label>
          <input id="fStartDate" type="date" required>
        </div>
        <div class="field">
          <label for="fEndDate">End date (optional)</label>
          <input id="fEndDate" type="date">
        </div>
      </div>
      <div class="field">
        <label for="fNotes">Notes</label>
        <textarea id="fNotes" rows="2"></textarea>
      </div>
      <div class="field" id="activeFieldWrap" style="display:flex; align-items:center; gap:0.5rem;">
        <input type="checkbox" id="fActive" style="width:auto" checked>
        <label for="fActive" style="margin:0">Active</label>
      </div>

      <div id="historySection" class="hidden">
        <hr style="border-color:var(--border); margin:1.25rem 0">
        <h2 style="font-size:0.95rem">Cost history</h2>
        <div id="historyList"></div>
        <div class="row-2" style="margin-top:0.75rem">
          <div class="field">
            <label for="hAmount">New cost (£)</label>
            <input id="hAmount" type="number" step="0.01" min="0">
          </div>
          <div class="field">
            <label for="hDate">Effective date</label>
            <input id="hDate" type="date">
          </div>
        </div>
        <div class="field">
          <label for="hNote">Note (optional)</label>
          <input id="hNote" placeholder="e.g. annual increase">
        </div>
        <button type="button" class="btn-secondary" id="addCostChangeBtn">Add cost change</button>
      </div>

      <div class="error-msg" id="formError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-danger hidden" id="deleteExpenseBtn">Delete</button>
        <button type="button" class="btn-secondary" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn-primary" style="width:auto">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/expenses.js"></script>
</body>
</html>
