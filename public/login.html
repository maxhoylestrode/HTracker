<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgeteer — Login</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budgeteer">
<script src="/js/theme-boot.js"></script>
<script src="/js/sw-register.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Budgeteer</h1>
    <p class="sub">Sign in to manage your household expenses</p>
    <form id="loginForm" method="POST" action="/api/auth/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <p class="auth-switch">New to the household? <a href="/signup.html">Create an account</a></p>
  </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
